apiVersion: v1
kind: Pod
metadata:
  name: web-liveness
  namespace: probes-demo
  labels:
    app: web
spec:
  containers:
    - name: nginx
      image: nginx
      livenessProbe:
        exec:
          command: ["cat", "/usr/share/nginx/html/healthz"]
        periodSeconds: 5
        failureThreshold: 1
